[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (неиспользуемые импорты, переменные)
    "I",   # isort (порядок импортов)
    "UP",  # pyupgrade (современный синтаксис Python)
]
ignore = [
    "E501", # длина строки — за это отвечает форматтер
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert в тестах — это нормально
